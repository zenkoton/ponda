name: ponda CI

# ponda 自有包的快速门禁（上游 pi 的全量 build/test 由 ci.yml 负责）：
# 类型检查 + 7 个 ponda 包测试 + 单文件 bundle 冒烟。
on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "packages/cli/**"
      - "packages/daemon/**"
      - "packages/rpc/**"
      - "packages/sandbox/**"
      - "packages/metrics/**"
      - "packages/tui-next/**"
      - "scripts/build-ponda-bundle.mjs"
      - ".github/workflows/ponda-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/core/**"
      - "packages/cli/**"
      - "packages/daemon/**"
      - "packages/rpc/**"
      - "packages/sandbox/**"
      - "packages/metrics/**"
      - "packages/tui-next/**"
      - "scripts/build-ponda-bundle.mjs"
      - ".github/workflows/ponda-ci.yml"

concurrency:
  group: ponda-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        # 上游 pi-tui 等原生编译所需（与 ci.yml 相同；--ignore-scripts 下 build 才需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build upstream packages
        # ponda 的依赖链经包名引用上游包（node_modules exports 指向 dist）
        run: npm run build

      - name: Type check
        run: node node_modules/@typescript/native-preview/bin/tsgo --noEmit

      - name: Test ponda packages
        run: |
          for p in core cli daemon rpc sandbox metrics tui-next; do
            echo "==> packages/$p"
            (cd "packages/$p" && node --test test/*.test.ts)
          done

      - name: Bundle CLI
        run: node scripts/build-ponda-bundle.mjs

      - name: Smoke test bundle
        env:
          PONDA_HOME: ${{ runner.temp }}/ponda-home
        run: |
          node packages/cli/dist/ponda.mjs --version
          node packages/cli/dist/ponda.mjs init
          node packages/cli/dist/ponda.mjs env list
          node packages/cli/dist/ponda.mjs run -p "hello bundle"
          node packages/cli/dist/ponda.mjs daemon stop
          node packages/cli/dist/ponda.mjs doctor
